<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hire Me - Alya</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">ADEL.</a>
    <nav class="menu">
      <a href="index.html">HOME</a>
      <a href="#works">WORKS</a>
      <a href="about.html">ABOUT</a>
      <a href="#contact">CONTACT</a>
    </nav>
    <a href="hire.html" class="btn btn-pink">HIRE ME</a>
  </header>
  <main class="form-wrapper">
    <h1 class="judul-form">Hire Me</h1>
    <p>Isi form di bawah ini ya, nanti saya hubungi kamu.</p>

    <form class="form-card">
      <label for="nama">Nama</label>
      <input type="text" id="nama" placeholder="Nama kamu">

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="email@contoh.com">

      <label for="jenis">Jenis Proyek</label>
      <select id="jenis">
        <option>Pixel Art</option>
        <option>Game Asset</option>
        <option>Desain Web</option>
      </select>

      <label for="pesan">Pesan</label>
      <textarea id="pesan" placeholder="Ceritakan proyek kamu..."></textarea>

      <div class="tombol-form">
        <button type="submit" class="btn btn-pink">KIRIM</button>
        <a href="index.html" class="btn btn-putih">KEMBALI</a>
      </div>
    </form>
  </main>

</body>
</html>
